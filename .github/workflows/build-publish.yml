name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Amber Linux's own archive follows amber-odin's monthly cadence
    # (see amber-odin/.github/workflows/monthly-release.yml); this runs a
    # day later so a same-month release has already landed in the archive.
    - cron: '0 6 2 * *'

# Neither job writes to the repository; the publish goes to Docker Hub with
# its own token. Keep GITHUB_TOKEN read-only regardless of the repo default.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: make ci

  deploy:
    if: github.event_name != 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: make deploy
