name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Build and check only. Publishing to Docker Hub is a manual `make deploy`,
# after the suite has been built with the same odin (docs/DEPLOY.md), so
# no workflow holds a Docker Hub token.
permissions:
  contents: read

# A public repo, so GitHub's own runners: the org's self-hosted runner is for
# private repos only.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The packages are the Makefile's DEPS list, empty: the step stays so one added there
      # reaches the runner.
      - name: system packages
        run: sudo apt-get update && make init-packages APT_FLAGS=-y

      - name: make ci
        run: make ci
